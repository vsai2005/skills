<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="checkout-card">
    <p class="eyebrow">MYTHRI MARKET</p>
    <h1>Checkout</h1>
    <p class="intro">Enter your email and continue to payment.</p>

    <form>
      <input name="email" type="email" placeholder="Email address">

      <div class="actions">
        <button class="primary" type="submit">Pay now</button>
        <button class="secondary" type="button">Cancel</button>
      </div>

      <p class="error" hidden>Payment failed. Try again.</p>
    </form>
  </main>
</body>
</html>
