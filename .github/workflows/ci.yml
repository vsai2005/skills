name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Validate repository
        run: python scripts/validate_repo.py . --warnings-as-errors
      - name: Check release manifest
        run: python scripts/generate_manifest.py . --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Heuristic self-audit
        run: >-
          python scripts/audit_structure.py .
          --exclude "scripts/audit_structure.py"
          --exclude "tests/fixtures/audit_structure/**"
          --fail-on high
      - name: Package smoke test
        run: |
          python scripts/package_release.py . --output-dir /tmp/engineering-quality-release
          unzip -t /tmp/engineering-quality-release/engineering-quality-agent-skills-v$(cat VERSION).zip
