name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q scripts tests skills
      - name: Validate repository
        run: python scripts/validate_repo.py . --warnings-as-errors
      - name: Check OpenAI metadata freshness
        run: python scripts/openai_metadata_check.py .
      - name: Check published evidence freshness
        run: python scripts/evidence_freshness.py .
      - name: Export standard Agent Skills evals
        run: python scripts/export_standard_evals.py . --output-dir .ci-standard-evals
      - name: Check release manifest
        run: python scripts/generate_manifest.py . --check
      - name: Check pending release tests
        run: python scripts/pending_tests.py check
      - name: Check context budget
        run: python scripts/context_budget.py . --fail-on-budget
      - name: Check portability
        run: python scripts/portability_check.py . --warnings-as-errors
      - name: Validate activation evals
        run: python scripts/activation_eval.py validate
      - name: Dry-run native activation adapters
        run: >-
          python scripts/activation_eval.py run --provider codex --dry-run --runs 1 --case debug-direct-01 --output-dir .ci-activation/codex
          && python scripts/activation_eval.py run --provider claude --dry-run --runs 1 --case debug-direct-01 --output-dir .ci-activation/claude
          && python scripts/activation_eval.py run --provider antigravity --dry-run --runs 1 --case debug-direct-01 --output-dir .ci-activation/antigravity
      - name: Validate live behavior evals
        run: python scripts/live_eval.py validate
      - name: Dry-run Antigravity live adapter
        run: python scripts/live_eval.py run --provider antigravity --dry-run --runs 1 --case project-quality-cross-layer-live --output-dir .ci-live-antigravity
      - name: Validate historical debug evals
        run: python scripts/live_eval.py validate --cases evals/historical-debug-cases.json
      - name: Validate composition evals
        run: python scripts/composition_eval.py validate
      - name: Validate empirical benchmark policy
        run: python scripts/benchmark_campaign.py validate
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Heuristic self-audit
        run: >-
          python scripts/audit_structure.py .
          --exclude "scripts/audit_structure.py"
          --exclude "tests/fixtures/audit_structure/**"
          --fail-on high
      - name: Package Antigravity plugin
        run: python scripts/package_antigravity.py . --output-dir .ci-antigravity
      - name: Package smoke test
        run: python scripts/package_release.py . --output-dir .ci-release
      - name: Test release ZIP
        run: python -c "from pathlib import Path; import zipfile; p=next(Path('.ci-release').glob('*.zip')); z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None, bad; print(p)"
